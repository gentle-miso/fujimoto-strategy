
name: Fujimoto Stock Analysis

on:
  # 한국시간 화~토요일 오전 7시
  schedule:
    - cron: '0 7 * * 2-6'
      timezone: 'Asia/Seoul'

  # 수동 실행 버튼
  workflow_dispatch:

jobs:
  stock-analysis:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. GitHub 저장소 불러오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 주식 분석 및 Google Drive 저장
      - name: Run stock analysis
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python main.py
