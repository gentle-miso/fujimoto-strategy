name: Fujimoto Stock Analysis

on:
  # 한국시간 화~토요일 오전 7시 (UTC 기준 월~금요일 오후 10시)
  schedule:
    - cron: '0 22 * * 1-5'

  # GitHub에서 수동 실행 가능
  workflow_dispatch:

# GitHub 저장소에 CSV를 커밋할 수 있도록 권한 부여
permissions:
  contents: write

jobs:
  stock-analysis:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 주식 분석 실행 (results 폴더에 직접 CSV 생성)
      - name: Run stock analysis
        run: python main.py

      # 5. results 폴더의 CSV 파일이 5개를 초과하면 오래된 파일 순으로 삭제
      - name: Keep only latest 5 CSV files
        shell: bash
        run: |
          mkdir -p results
          
          # results 폴더 내의 모든 csv 파일을 시간순(오래된 것부터) 정렬하여 배열에 저장
          cd results
          shopt -s nullglob
          files=( $(ls -tr *.csv) )
          
          total_files=${#files[@]}
          echo "현재 보관 중인 CSV 파일 개수: $total_files"
          
          # 파일 개수가 5개를 초과하는 경우
          if (( total_files > 5 )); then
            excess=$(( total_files - 5 ))
            echo "최근 5개 유지를 위해 오래된 파일 $excess 개를 삭제합니다."
            
            for (( i=0; i<excess; i++ )); do
              echo "삭제: ${files[i]}"
              rm -f "${files[i]}"
            done
          fi
          
          cd ..
          echo "최종 보관 대상 CSV 목록:"
          ls -lh results/

      # 6. GitHub에 CSV 변경 사항 커밋 및 푸시
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A results/

          if git diff --cached --quiet; then
            echo "GitHub에 변경할 내용이 없습니다."
          else
            git commit -m "Update stock analysis results (Keep latest 5)"
            git push
          fi
