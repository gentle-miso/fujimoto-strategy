
name: Stock Analysis and Google Drive Upload

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'

jobs:
  stock-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # JSON 인증 파일 생성
      - name: Setup Google credentials
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_JSON" > google-credentials.json
          chmod 600 google-credentials.json

      # 주식 분석 실행 및 Google Drive 업로드
      - name: Run stock analysis
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/google-credentials.json
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python main.py

      # 인증 파일 삭제
      - name: Remove credentials
        if: always()
        run: |
          rm -f google-credentials.json
