name: Stock Analysis and Google Drive Upload

on:
  workflow_dispatch:

  schedule:
    - cron: '30 12 * * 1-5'

jobs:
  stock-analysis:

    runs-on: ubuntu-latest

    steps:

      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Google 인증 JSON 파일 생성
      - name: Setup Google credentials
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          echo "$GOOGLE_JSON" | base64 --decode > google-credentials.json

      # 5. 종목 분석 및 Google Drive 업로드
      - name: Run stock analysis
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/google-credentials.json
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python main.py

      # 6. 인증 파일 삭제
      - name: Remove credentials
        if: always()
        run: |
          rm -f google-credentials.json
