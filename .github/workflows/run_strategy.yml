name: Fujimoto Strategy Daily Scan

on:
  schedule:
    # 매일 한국 시간 오전 7시 = UTC 기준 전날 오후 10시 (22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  run-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브 레포지토리에 CSV 파일을 자동으로 커밋할 권한 부여

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fujimoto_strategy_results.csv
          git commit -m "Auto-update: Fujimoto strategy scan results" || exit 0
          git push
